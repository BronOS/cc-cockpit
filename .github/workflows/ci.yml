# Typecheck, lint and unit tests on both systems we ship for. Also called by release.yml, so a tag runs
# exactly these checks. The e2e suite stays out: its window tests depend on a window manager, so it is a
# manual step before tagging (docs/plans/completed/20261102-distribution.md).
# Never `pull_request_target`, which would hand a write token to a run next to fork content.
name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      # One system failing says nothing about the other: let both report.
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: a cache shared with PR runs could feed a release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 26.8.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The bundled reviewer and editor keep their own node:test suites (plain JS, no build).
      - run: npm run test:plugins

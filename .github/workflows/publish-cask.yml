# Publishing a release (the maintainer's click on a draft) writes the Homebrew cask to BronOS/homebrew-tap.
# The tap token appears in the last step only; the earlier steps run with a read-only GITHUB_TOKEN. The tag
# reaches shell through env, never interpolated into `run`.
name: publish-cask
on:
  release:
    types: [published]
permissions:
  contents: read
# Two releases close together (or a re-run) would race on the tap and the loser's push is rejected, so runs go
# one at a time. A group holds one running and one pending run, and a newer pending run cancels the older one:
# with 1.0.0 running and 1.2.0 pending, publishing a late 1.1.0 drops the 1.2.0 run (review finding). So no run
# acts on its event's release. Each reads the newest published release when it starts: the run left pending is
# always the last one queued, it starts after every release that queued a run, and it brings the tap up to the
# newest of them whichever release triggered it. For the same reason a prerelease is not skipped with a job `if`:
# the group is taken before a job's `if` is looked at, so its run can replace a pending one as well. It picks the
# newest stable release like any other run, which leaves the tap as it is.
concurrency:
  group: publish-cask
jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Find the newest published stable release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigned on its own line: the default shell has no pipefail, and an API failure read as "no
          # releases" would end the run green with the tap behind.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name')"
          # The tag rule of scripts/stable-version.mjs. Anything else was never a release.yml build.
          newest="$(printf '%s\n' "$tags" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)"
          echo "publish-cask: newest stable release: ${newest:-none}"
          echo "tag=$newest" >> "$GITHUB_OUTPUT"
  cask:
    needs: newest
    # No stable release yet: only prereleases so far, and nothing for the tap.
    if: ${{ needs.newest.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The renderer of the release being written, not of a backport that happened to trigger this run.
          ref: refs/tags/${{ needs.newest.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 26.8.1
      - name: Download the dmg and check it against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.newest.outputs.tag }}
        run: |
          mkdir assets
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "cc-cockpit-$version-mac-arm64.dmg" --pattern SHA256SUMS
          cd assets
          grep -F -- "cc-cockpit-$version-mac-arm64.dmg" SHA256SUMS > dmg.sha256 \
            || { echo "publish-cask: no dmg line in SHA256SUMS" >&2; exit 1; }
          test "$(wc -l < dmg.sha256)" -eq 1 || { echo "publish-cask: expected one dmg line in SHA256SUMS" >&2; exit 1; }
          sha256sum --check dmg.sha256
      - name: Render the cask
        env:
          TAG: ${{ needs.newest.outputs.tag }}
        run: |
          version="${TAG#v}"
          sha="$(sha256sum "assets/cc-cockpit-$version-mac-arm64.dmg" | cut -d' ' -f1)"
          mkdir -p tap/Casks
          node scripts/render-cask.mjs "$version" "$sha" > tap/Casks/cc-cockpit.rb
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ needs.newest.outputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "publish-cask: the TAP_TOKEN secret is not set; create a token with write access to BronOS/homebrew-tap" >&2
            exit 1
          fi
          # The token goes in a request header set through git's environment: a clone URL would land in
          # repo/.git/config, and `git -c` would put it in argv, where any process can read it. Masked
          # first so the base64 form never prints.
          auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          git clone --depth 1 https://github.com/BronOS/homebrew-tap.git repo
          # Never move every `brew upgrade` back: the newest published release can be older than the cask
          # when the release behind the cask was withdrawn, and then the tap's owner decides.
          version="${TAG#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' repo/Casks/cc-cockpit.rb 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "publish-cask: the tap already has $current, newer than $version; leaving it"
            exit 0
          fi
          mkdir -p repo/Casks
          cp tap/Casks/cc-cockpit.rb repo/Casks/cc-cockpit.rb
          cd repo
          git config user.name "cc-cockpit release"
          git config user.email "noreply@cc-cockpit.invalid"
          git add Casks/cc-cockpit.rb
          git diff --cached --quiet && { echo "publish-cask: the cask is already up to date"; exit 0; }
          git commit -m "cc-cockpit $TAG"
          # Explicit branch: a clone of an empty tap names its branch from init.defaultBranch (master on a
          # runner), which would not be the repo's default branch.
          git push origin HEAD:refs/heads/main

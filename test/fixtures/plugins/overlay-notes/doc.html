<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlay notes</title>
    <script src="/__sdk/panel.js"></script>
    <script src="doc.js" defer></script>
  </head>
  <body>
    <main id="doc"><p>Loading…</p></main>
    <section id="notes" hidden><h2>Notes</h2><ul id="note-list"></ul><input id="note-text" aria-label="Note" /><button id="add-note" type="button">Add note</button><p id="note-error"></p></section>
    <section id="ask" hidden><ul id="history"></ul><input id="question" aria-label="Ask" /><button id="ask-send" type="button">Ask</button><pre id="answer"></pre><p id="ask-notice"></p><button id="ask-continue" type="button">Continue in a tab</button><p id="continue-result"></p></section>
    <button id="discuss" type="button" hidden>Discuss</button>
    <p id="features"></p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Files</title>
    <!-- CSP: scripts only from this plugin's own files, so all logic is in tree.js (the menu's items in dist/lib/menu.js). -->
    <script src="../__sdk/panel.js"></script>
    <script src="../dist/lib/menu.js"></script>
    <script src="tree.js" defer></script>
    <style>
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; font: 12px/1.4 system-ui, sans-serif; background: var(--cc-bg); color: var(--cc-fg); }
      header { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--cc-border); }
      /* Input, buttons and the error line are the SDK's component sheet; the tree rows are the page's
         own (22px, indented), so they set their height here. */
      #filter { flex: 1; min-width: 0; }
      #error { display: none; margin: 6px; border-left: 3px solid var(--cc-status-ended); word-break: break-word; }
      #error.on { display: block; }
      #list { flex: 1; overflow: auto; padding: 2px 0 12px; outline: none; }
      .row { display: flex; align-items: center; gap: 4px; height: 22px; min-height: 22px; padding: 0 6px 0 0; border-radius: 0; white-space: nowrap; cursor: pointer; user-select: none; }
      .row:hover { background: var(--cc-surface-1); }
      .row.sel { background: var(--cc-accent-soft); }
      #list:focus .row.sel { outline: 1px solid var(--cc-focus); outline-offset: -1px; }
      .twisty { width: 12px; flex: none; text-align: center; color: var(--cc-fg-subtle); font-size: 9px; }
      .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .dir > .name { color: var(--cc-fg); }
      .ignored > .name, .ignored > .twisty { opacity: 0.5; }
      .link > .name::after { content: ' ↗'; color: var(--cc-fg-subtle); }
      .blocked { cursor: default; }
      .path { color: var(--cc-fg-subtle); margin-left: 6px; }
      .mark { flex: none; width: 12px; text-align: center; font: 10px/1 ui-monospace, monospace; }
      .mark.M { color: var(--cc-status-needs-permission); }
      .mark.A, .mark.q { color: var(--cc-status-waiting); }
      .mark.D, .mark.U { color: var(--cc-status-ended); }
      .mark.R { color: var(--cc-status-working); }
      .mark.dot::before { content: '•'; color: var(--cc-fg-muted); }
      .row .edit { display: none; height: 18px; padding: 0 5px; font-size: 11px; }
      .row.file:hover .edit, .row.file.sel .edit { display: inline-block; }
      .note { padding: 3px 8px 3px 24px; color: var(--cc-fg-subtle); font-style: italic; }
      .empty { padding: 12px; color: var(--cc-fg-muted); }
      /* The name bar of Rename… / New file… / New folder…: the toolbar component, under the header. */
      #namebar { padding: 6px; border-bottom: 1px solid var(--cc-border); flex-wrap: wrap; }
      #namebar label { flex: 1 0 100%; color: var(--cc-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #namebar input { flex: 1; min-width: 0; }
    </style>
  </head>
  <body>
    <header>
      <input id="filter" type="search" placeholder="Filter files (/)" spellcheck="false" autocomplete="off" />
      <button id="collapse" class="cc-btn cc-ghost cc-icon" type="button" title="Collapse all">⊟</button>
      <button id="refresh" class="cc-btn cc-ghost cc-icon" type="button" title="Refresh">⟳</button>
    </header>
    <!-- Not a <form>: the sandboxed frame has no allow-forms, so a submit never fires; Enter is handled in tree.js. -->
    <div id="namebar" class="cc-toolbar" hidden>
      <label id="namebar-label" for="namebar-input"></label>
      <input id="namebar-input" type="text" spellcheck="false" autocomplete="off" />
      <button id="namebar-ok" class="cc-primary" type="button">OK</button>
      <button id="namebar-cancel" class="cc-ghost" type="button">Cancel</button>
    </div>
    <div id="error" class="cc-error-line" role="alert"></div>
    <div id="list" tabindex="0" role="tree" aria-label="Project files"></div>
  </body>
</html>

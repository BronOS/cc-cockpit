<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review</title>
    <!-- CSP: scripts only from this plugin's files (no inline script); the page logic is the
         bundle built from src/page/review.js by `npm run build`. -->
    <script src="/__sdk/panel.js"></script>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body class="loading">
    <!-- Shown until the host's init comes: at once on every open, and for as long as a caller of the
         reviewer service still fetches what it shows (prepare, then annotate). -->
    <div id="loading" role="status"><span class="cc-spinner" aria-hidden="true"></span>Loading…</div>
    <!-- In place of the loader when the caller's fetch failed (the service's fail): its message as
         text, Close, and Try again when the caller can answer one (back to the loader). -->
    <div id="failed" role="alert">
      <div class="failed-box">
        <p id="failed-message"></p>
        <div class="failed-buttons">
          <button id="failed-retry" type="button" class="cc-primary" hidden>Try again</button>
          <button id="failed-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <header>
      <div class="title">
        <strong id="path"></strong>
        <span id="base" class="muted"></span>
      </div>
      <div class="tools">
        <!-- The status line (an error, a link that cannot be opened from here): muted, at the right. -->
        <span id="status" class="muted" role="status"></span>
        <button id="mdview" type="button" hidden>Source</button>
        <button id="layout" type="button" title="Switch between side by side and unified">Unified</button>
      </div>
    </header>
    <div id="note" class="banner" hidden></div>
    <div id="draft-error" class="banner error" role="alert" hidden></div>
    <textarea id="global" rows="2" maxlength="20000" placeholder="Comment on the whole file (optional)"></textarea>
    <div id="global-limit" class="limit" hidden></div>
    <div id="notes-limit" class="limit" hidden>200 notes, the most one review keeps: delete one to add another.</div>
    <!-- The notes, under the comment; hidden while there is none. -->
    <ol id="notes" aria-label="Notes" hidden></ol>
    <main>
      <div id="editors"></div>
      <!-- annotate's `aside`: the caller's details column, sanitized like the document. -->
      <aside id="details" aria-label="Details" hidden><article id="details-body" class="doc-body details-body"></article></aside>
    </main>
    <!-- "Add note", floating just under the end of the selection (the page positions it; hidden while
         there is none). -->
    <button id="add-note" type="button" title="Attach a note to the selected text (a)" hidden>Add note</button>
    <!-- annotate's url: the page cannot open links (a sandboxed frame), so a click asks the host,
         which opens the URL its caller gave with ctx.openExternal. The page moves this button into
         the document: at the end of its first h1, else to its top right corner. -->
    <button id="open-url" class="icon" type="button" title="Open in browser" aria-label="Open in browser" hidden>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v3.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1H7" />
        <path d="M10 2.5h3.5V6" />
        <path d="M13.5 2.5 7.5 8.5" />
      </svg>
    </button>
    <!-- annotate's HTML mode: an image shown larger. A click or a key closes it. -->
    <div id="lightbox" tabindex="-1" role="dialog" aria-label="Image" hidden><img id="lightbox-img" alt="" /></div>
    <script src="review.bundle.js"></script>
  </body>
</html>

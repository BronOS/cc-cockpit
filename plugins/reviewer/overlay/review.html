<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review</title>
    <!-- CSP: scripts only from this plugin's files (no inline script); the page logic is the
         bundle built from src/page/review.js by `npm run build`. -->
    <script src="/__sdk/panel.js"></script>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <header>
      <div class="title"><strong id="path"></strong> <span id="base" class="muted"></span></div>
      <div class="tools">
        <button id="add-note" type="button" disabled title="Attach a note to the selected text (a)">Add note</button>
        <button id="layout" type="button" title="Switch between side by side and unified">Unified</button>
      </div>
    </header>
    <div id="note" class="banner" hidden></div>
    <div id="draft-error" class="banner error" role="alert" hidden></div>
    <textarea id="global" rows="2" maxlength="20000" placeholder="Comment on the whole file (optional)"></textarea>
    <div id="global-limit" class="limit" hidden></div>
    <main>
      <div id="editors"></div>
      <aside>
        <h2>Notes <span id="notes-count" class="muted"></span></h2>
        <div id="notes-limit" class="limit" hidden>200 notes, the most one review keeps: delete one to add another.</div>
        <div id="notes"></div>
      </aside>
    </main>
    <footer>
      <span id="status" class="muted"></span>
      <span class="spacer"></span>
      <span id="queued" class="muted"></span>
      <select id="target" title="The Claude tab Discuss sends to"></select>
      <button id="discuss" class="primary" type="button">Discuss</button>
      <button id="edit" type="button" title="Open the file in the editor at the cursor's line (e)">Edit</button>
      <button id="new-session" type="button" title="Open a new Claude tab with this review as its prompt">New session</button>
      <button id="close" type="button" title="Close without sending; the draft is kept (Esc too)">Close</button>
    </footer>
    <script src="review.bundle.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File</title>
    <!-- CSP: scripts only from this plugin's files (no inline script); the page logic is the bundle
         built from src/page/file.js by `npm run build:editor`. Relative URLs only (web access serves
         the page under a path prefix). -->
    <script src="../../__sdk/panel.js"></script>
    <link rel="stylesheet" href="file.css" />
  </head>
  <body class="loading">
    <header>
      <strong id="path" class="path"></strong>
      <span id="state" class="state" role="status"></span>
      <span class="spacer"></span>
      <!-- The file's language server (its name; "…" while it starts), hidden when there is none. -->
      <span id="lsp" class="lsp-state" hidden></span>
      <button id="micro" type="button" class="cc-ghost" title="Edit this file in micro, in a terminal overlay">Open in micro</button>
    </header>
    <!-- One line under the header: a read or save error, the file changed or deleted on disk, a file
         that is not shown (binary, too large). Hidden while there is nothing to say. -->
    <div id="bar" class="bar" role="alert" hidden>
      <span id="bar-text"></span>
      <span id="bar-actions" class="actions"></span>
    </div>
    <!-- The language bar: the server missing (its install command), failed (Restart), and what a
         rename, a format or a code action did. Hidden while there is nothing to say. -->
    <div id="lsp-bar" class="bar" role="status" hidden>
      <span id="lsp-text"></span>
      <span id="lsp-actions" class="actions"></span>
    </div>
    <main id="editor"></main>
    <!-- Quick chat (Ctrl+K): a read-only headless Claude about the selection, docked under the editor. -->
    <section id="chat" class="chat" role="dialog" aria-label="Quick chat" hidden>
      <div class="chat-head">
        <strong>Quick chat</strong>
        <span id="chat-about" class="chat-about"></span>
        <span id="chat-model" class="chat-model"></span>
        <span id="chat-status" class="chat-status" role="status"></span>
        <span class="spacer"></span>
        <button id="chat-close" type="button" class="cc-ghost" title="End the chat (Esc)" aria-label="End the chat">×</button>
      </div>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <div class="chat-input">
        <textarea id="chat-input" rows="2" spellcheck="false"></textarea>
        <button id="chat-send" type="button" class="cc-primary">Send</button>
      </div>
    </section>
    <!-- Quick open (Ctrl+P) and find in files (Ctrl+Shift+F): one palette over the editor. -->
    <div id="palette" class="palette" role="dialog" aria-label="Go to file or find in files" hidden>
      <div class="palette-input">
        <input id="palette-query" type="text" spellcheck="false" autocomplete="off" />
        <span id="palette-toggles" class="toggles" hidden>
          <button type="button" id="t-case" class="toggle" title="Match case" aria-pressed="false">Aa</button>
          <button type="button" id="t-word" class="toggle" title="Whole word" aria-pressed="false">ab</button>
          <button type="button" id="t-regex" class="toggle" title="Regular expression" aria-pressed="false">.*</button>
        </span>
      </div>
      <div id="palette-status" class="palette-status" role="status"></div>
      <ul id="palette-list" class="palette-list" role="listbox"></ul>
    </div>
    <!-- The editor's context menu: Ask Claude (core's Discuss for this tab). -->
    <div id="ctxmenu" class="ctxmenu" role="menu" hidden>
      <button id="ctx-ask" type="button" role="menuitem"><span>Ask Claude about this…</span><kbd id="ctx-ask-key"></kbd></button>
      <!-- Shown only while a Reviewer answers (the reviewer service's notes). -->
      <button id="ctx-note" type="button" role="menuitem" hidden><span>Add review note…</span></button>
    </div>
    <!-- Add review note: a note on the selected lines, written to the Reviewer's own store. -->
    <section id="notebox" class="notebox" role="dialog" aria-label="Add review note" hidden>
      <div id="notebox-about" class="notebox-about"></div>
      <textarea id="notebox-text" rows="3" maxlength="4000" spellcheck="false" placeholder="What should change here?"></textarea>
      <div class="notebox-actions">
        <span id="notebox-error" class="notebox-error" role="alert"></span>
        <button id="notebox-cancel" type="button" class="cc-ghost">Cancel</button>
        <button id="notebox-add" type="button" class="cc-primary" title="Ctrl+Enter">Add note</button>
      </div>
    </section>
    <script src="file.bundle.js"></script>
  </body>
</html>

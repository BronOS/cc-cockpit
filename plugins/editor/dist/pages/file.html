<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File</title>
    <!-- CSP: scripts only from this plugin's files (no inline script); the page logic is the bundle
         built from src/page/file.js by `npm run build:editor`. Relative URLs only (web access serves
         the page under a path prefix). -->
    <script src="../../__sdk/panel.js"></script>
    <link rel="stylesheet" href="file.css" />
  </head>
  <body class="loading">
    <header>
      <strong id="path" class="path"></strong>
      <span id="state" class="state" role="status"></span>
      <span class="spacer"></span>
      <button id="micro" type="button" class="cc-ghost" title="Edit this file in micro, in a terminal overlay">Open in micro</button>
    </header>
    <!-- One line under the header: a read or save error, the file changed or deleted on disk, a file
         that is not shown (binary, too large). Hidden while there is nothing to say. -->
    <div id="bar" class="bar" role="alert" hidden>
      <span id="bar-text"></span>
      <span id="bar-actions" class="actions"></span>
    </div>
    <main id="editor"></main>
    <script src="file.bundle.js"></script>
  </body>
</html>

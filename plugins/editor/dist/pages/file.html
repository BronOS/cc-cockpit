<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File</title>
    <!-- CSP: scripts only from this plugin's files (no inline script); the page logic is the bundle
         built from src/page/file.js by `npm run build:editor`. Relative URLs only (web access serves
         the page under a path prefix). -->
    <script src="../../__sdk/panel.js"></script>
    <link rel="stylesheet" href="file.css" />
  </head>
  <body class="loading">
    <header>
      <strong id="path" class="path"></strong>
      <span id="state" class="state" role="status"></span>
      <span class="spacer"></span>
      <button id="micro" type="button" class="cc-ghost" title="Edit this file in micro, in a terminal overlay">Open in micro</button>
    </header>
    <!-- One line under the header: a read or save error, the file changed or deleted on disk, a file
         that is not shown (binary, too large). Hidden while there is nothing to say. -->
    <div id="bar" class="bar" role="alert" hidden>
      <span id="bar-text"></span>
      <span id="bar-actions" class="actions"></span>
    </div>
    <main id="editor"></main>
    <!-- Quick open (Ctrl+P) and find in files (Ctrl+Shift+F): one palette over the editor. -->
    <div id="palette" class="palette" role="dialog" aria-label="Go to file or find in files" hidden>
      <div class="palette-input">
        <input id="palette-query" type="text" spellcheck="false" autocomplete="off" />
        <span id="palette-toggles" class="toggles" hidden>
          <button type="button" id="t-case" class="toggle" title="Match case" aria-pressed="false">Aa</button>
          <button type="button" id="t-word" class="toggle" title="Whole word" aria-pressed="false">ab</button>
          <button type="button" id="t-regex" class="toggle" title="Regular expression" aria-pressed="false">.*</button>
        </span>
      </div>
      <div id="palette-status" class="palette-status" role="status"></div>
      <ul id="palette-list" class="palette-list" role="listbox"></ul>
    </div>
    <script src="file.bundle.js"></script>
  </body>
</html>

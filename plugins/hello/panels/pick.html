<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pick a colour</title>
    <script src="/__sdk/panel.js"></script>
    <script src="pick.js"></script>
    <style>
      body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: var(--cc-bg); color: var(--cc-fg); }
      button { font: inherit; color: inherit; background: var(--cc-bg-menu); border: 1px solid var(--cc-border); border-radius: 4px; padding: 4px 10px; margin-right: 6px; }
    </style>
  </head>
  <body>
    <p>Pick a colour; the plugin's host gets the answer.</p>
    <button type="button" data-colour="blue">Blue</button>
    <button type="button" data-colour="green">Green</button>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello settings</title>
    <!-- A plugin's html settings page (contributes.settings.page): the panel SDK, theme and
         components as in a panel, and a port to this plugin's backend (ctx.settingsPage.onOpen).
         The settings classes (`ccc guide style`, "Settings page") draw it like the app's form above it:
         the title and description over a card, one row per setting. -->
    <script src="/__sdk/panel.js"></script>
    <script src="index.js"></script>
    <style>
      body { margin: 0; padding: var(--cc-space-4); background: var(--cc-bg); }
      #note { width: 220px; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <section class="cc-settings-group">
      <div class="cc-settings-head">
        <h3>Note</h3>
        <p class="cc-settings-desc">A sample settings page: a note kept by the plugin (<span id="scope">…</span> scope).</p>
      </div>
      <div class="cc-settings-card">
        <div class="cc-settings-row">
          <div class="cc-settings-row-text">
            <label class="cc-settings-label" for="note">Note</label>
            <span class="cc-settings-help">Stored by the backend, at most 200 characters.</span>
          </div>
          <div class="cc-settings-control">
            <input id="note" type="text" maxlength="200" />
            <button id="save" type="button" class="cc-primary">Save note</button>
          </div>
        </div>
        <div id="status" role="status" class="cc-settings-row cc-muted"></div>
      </div>
    </section>
  </body>
</html>

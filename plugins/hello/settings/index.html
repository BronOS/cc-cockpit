<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello settings</title>
    <!-- A plugin's html settings page (contributes.settings.page): the panel SDK, theme and
         components as in a panel, and a port to this plugin's backend (ctx.settingsPage.onOpen). -->
    <script src="/__sdk/panel.js"></script>
    <script src="index.js"></script>
    <style>
      body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: var(--cc-bg); color: var(--cc-fg); }
      .row { display: flex; gap: 6px; align-items: center; }
      input { flex: 1; }
    </style>
  </head>
  <body>
    <p>A sample settings page: a note kept by the plugin (<span id="scope">…</span> scope).</p>
    <div class="row">
      <input id="note" type="text" maxlength="200" aria-label="Note" />
      <button id="save" type="button">Save note</button>
    </div>
    <p id="status" role="status"></p>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- cc-cockpit app icon: a terminal tile whose screen holds an instrument gauge, its needle
       pointing up-right, above a prompt caret. macOS grid: the tile is 824px with a 100px margin. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2725"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c4633f"/>
      <stop offset="1" stop-color="#ec9a76"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="512" cy="500" r="330" fill="url(#glow)"/>

  <!-- gauge: a 240° track open at the bottom, the lit part from the left stop to the needle -->
  <g fill="none" stroke-linecap="round">
    <path d="M 295.5 625 A 250 250 0 1 1 728.5 625" stroke="#3a3633" stroke-width="34"/>
    <path d="M 295.5 625 A 250 250 0 0 1 689 323" stroke="url(#clay)" stroke-width="34"/>
  </g>
  <!-- ticks, just inside the track (radius 196-218) so they read as a scale, not notches -->
  <g stroke="#5d5751" stroke-width="9" stroke-linecap="round">
    <line x1="512" y1="282" x2="512" y2="304"/>
    <line x1="358" y1="346" x2="373" y2="361"/>
    <line x1="666" y1="346" x2="651" y2="361"/>
    <line x1="294" y1="500" x2="316" y2="500"/>
    <line x1="730" y1="500" x2="708" y2="500"/>
  </g>
  <!-- needle and hub -->
  <line x1="512" y1="500" x2="648" y2="364" stroke="#f3ede8" stroke-width="20" stroke-linecap="round"/>
  <circle cx="512" cy="500" r="34" fill="#f3ede8"/>
  <circle cx="512" cy="500" r="13" fill="#d97757"/>

  <!-- prompt in the gauge's open bottom: a caret and a cursor block -->
  <path d="M 432 676 L 476 712 L 432 748" fill="none" stroke="url(#clay)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="504" y="724" width="92" height="26" rx="8" fill="#f3ede8"/>
</svg>
